[project]
name = "ideomes-agents"
version = "0.1.0"
description = "Agents IA d'Idéomès (Geomessen) : Zeus, Apollon, Hermès et les 12 agents A1 à A12"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40", "langgraph>=0.2", "pydantic>=2.6", "pydantic-settings>=2.2",
  "jsonschema>=4.21", "pyyaml>=6", "httpx>=0.27",
]

[project.scripts]
ideomes = "ideomes_agents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ideomes_agents*"]

[tool.setuptools.package-data]
ideomes_agents = ["agents.yaml", "prompts/*.md", "schemas/*.json", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
