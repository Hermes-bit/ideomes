name: Veille Hermès

# Hermès cherche chaque matin les avancées récentes au Burkina Faso, vérifie
# chaque chiffre dans l'article d'origine et dépose des propositions dans la
# collection « veille ». Rien n'est publié sans l'accord de l'administrateur :
# les propositions attendent dans le tableau de bord.

# La veille automatique est en sommeil : elle consomme des appels payants
# (recherche web + modèle), et les secrets ANTHROPIC_API_KEY et
# SUPABASE_SERVICE_ROLE_KEY ne sont pas posés. Sans eux, une exécution planifiée
# échouerait chaque matin pour rien.
#
# Pour la réveiller : poser les deux secrets, puis décommenter les deux lignes
# « schedule » ci-dessous. Le déclenchement manuel reste disponible entre-temps
# (onglet Actions > Veille Hermès > Run workflow).
on:
  # schedule:
  #   - cron: "52 6 * * *"   # 06:52 UTC, soit l'heure du Burkina Faso (UTC+0)
  workflow_dispatch:

# Une seule veille à la fois : deux exécutions simultanées se marcheraient dessus.
concurrency:
  group: veille-hermes
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les agents
        run: pip install ./agents

      - name: Lancer la veille
        env:
          LLM_MODE: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: ideomes veille
